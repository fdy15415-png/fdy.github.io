<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>纸马 · 白岳｜甲马图录</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f4efe4;color:#25251f;font-family:"Microsoft YaHei",sans-serif}button,a{color:inherit;font:inherit}button{cursor:pointer}a{text-decoration:none}a:hover{text-decoration:underline}button:focus-visible,a:focus-visible{outline:3px solid #ab4435;outline-offset:4px}header,main,footer{max-width:1500px;margin:auto;padding-inline:5vw}header{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #aaa596}header strong,h1,h2,h3{font-family:SimSun,"Songti SC",serif}header strong{font-size:23px}nav{display:flex;gap:28px;font-size:14px}.spread{display:grid;grid-template-columns:.85fr 1.15fr;align-items:center;min-height:470px;padding:50px 0;gap:5vw}.intro small{letter-spacing:.16em;color:#924233}.intro h1{font-size:clamp(54px,6.6vw,105px);margin:18px 0;letter-spacing:-.04em}.intro p{line-height:1.8;color:#625e52}.action{display:inline-block;background:#88392c;color:white;padding:13px 22px;margin-top:12px}.prints{position:relative;height:clamp(270px,29vw,440px);display:flex;align-items:center;justify-content:center}.prints button{width:34%;background:none;border:0;padding:0;transform:rotate(-9deg);transition:translate .2s}.prints button:nth-child(2){margin-inline:-6%;transform:rotate(2deg);z-index:2}.prints button:last-child{transform:rotate(10deg)}.prints button:hover{translate:0 -8px}.prints img{display:block;width:100%;aspect-ratio:2/3;box-shadow:2px 7px 15px #33281936}section{border-top:1px solid #918e80;padding:26px 0}.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.bar h2{font-size:32px;margin:0}.bar small{font:14px Georgia;color:#767164}#filters{display:flex;gap:6px;flex-wrap:wrap}#filters button{background:none;border:1px solid transparent;padding:6px 10px}#filters [aria-pressed=true]{border-color:#333}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:30px 2vw;margin:26px 0}.tile{background:none;border:0;text-align:left;padding:0}.tile img{width:100%;aspect-ratio:2/3;object-fit:contain;background:#e6dfd0;display:block}.tile span{display:flex;justify-content:space-between;align-items:center;padding-top:9px;font: bold 20px SimSun,serif}.tile small{font:12px sans-serif;color:#645e52}footer{padding-block:24px;font-size:13px;color:#645e52}dialog{background:#f4efe4;color:inherit;border:0;padding:20px;width:min(480px,94vw);max-height:95dvh}dialog::backdrop{background:#211d17bf}dialog div{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}dialog h2{margin:0}dialog button{background:none;border:1px solid;padding:5px 10px}dialog img{display:block;width:100%;height:65dvh;object-fit:contain}dialog p{text-align:center}@media(max-width:760px){header{height:62px}nav{gap:14px}.spread{grid-template-columns:1fr;padding:30px 0 20px;gap:15px}.prints{height:255px}.prints button{width:min(26%,155px)}.intro h1{margin:10px 0}.grid{grid-template-columns:repeat(2,1fr);gap:20px 14px}.bar h2{font-size:26px}}
</style><header><strong>纸马 · 白岳</strong><nav><a href="#catalog">甲马图录</a><a href="index.html">进入古村 ↗</a></nav></header><main><div class="spread"><div class="intro"><small>云南甲马 ／ 木刻印样</small><h1>甲马图录</h1><p>从一匹神马、一座土灶，到一条山路。<br>翻看二十幅印样里的神祇与乡土日常。</p><a class="action" href="#catalog">翻阅印样 ↓</a></div><div class="prints" id="featured"></div></div><section id="catalog"><div class="bar"><h2>印样目录 <small id="count"></small></h2><div id="filters" aria-label="按纸色筛选"></div></div><div class="grid" id="grid"></div></section></main><footer>纸马 · 白岳　／　项目原创数字印样</footer><dialog id="viewer" aria-labelledby="title"><div><h2 id="title"></h2><button id="closeView">关闭 ×</button></div><img id="full" alt=""><p><a id="visit">去印纸铺看这张 →</a>　 <a id="original" target="_blank" rel="noopener">打开原图 ↗</a></p></dialog>
<script>
const names='灶神 神馬 土地山神 火神之位 水草大王 白虎之神 河泊水神 五穀神 橋神 路神 木神 家神 喜神 月神 財神 壽星 青龍 玄武 腳力神 本主娘娘'.split(' ');
const colors=['素白','朱红','灰白','桃红','麦黄'];
const el=id=>document.getElementById(id);
function path(i){return 'assets/jiama/'+String(i+1).padStart(2,'0')+'-'+names[i]+'.webp'}
function view(i){el('visit').href='index.html?print='+String(i+1);el('title').textContent=names[i];el('full').src=el('original').href=path(i);el('full').alt=names[i]+'木刻印样';el('viewer').showModal()}
function tile(i,featured){const b=document.createElement('button');b.setAttribute('aria-label','细看'+names[i]);const img=new Image();img.alt=names[i];img.src=path(i);if(!featured)img.loading='lazy';b.append(img);if(!featured){b.className='tile';const s=document.createElement('span');s.textContent=names[i];const c=document.createElement('small');c.textContent=colors[i%5];s.append(c);b.append(s)}b.onclick=()=>view(i);return b}
function filter(color){const ids=names.map((_,i)=>i).filter(i=>color==='全部'||colors[i%5]===color);el('grid').replaceChildren(...ids.map(i=>tile(i,false)));el('count').textContent=ids.length+' 幅';for(const b of el('filters').children)b.setAttribute('aria-pressed',String(b.textContent===color))}
for(const c of ['全部',...colors]){const b=document.createElement('button');b.textContent=c;b.onclick=()=>filter(c);el('filters').append(b)}
el('featured').append(...[5,1,4].map(i=>tile(i,true)));filter('全部');const requested=Number(new URLSearchParams(location.search).get('print'));if(Number.isInteger(requested)&&requested>=1&&requested<=names.length)view(requested-1);el('closeView').onclick=()=>el('viewer').close();
</script></html>
